name: capture ephemeral lineups

# Sisyphos and Tresor publish lineups late and remove them after the party. This captures
# them before they vanish (gone by Wed/Thu), then commits the updated database. Runs once
# on Sunday — by then the weekend's lineups are up but not yet removed. Trigger manually
# any time via the Actions tab (workflow_dispatch) if you want an extra catch.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 0'   # Sun 14:00 UTC (Berlin 15:00/16:00)

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture ephemeral lineups (Sisyphos + Tresor)
        run: npm run capture -- --no-build

      - name: Commit any newly captured data
        run: |
          git config user.name  "capture-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/; then
            git add data/berlin.db data/capture.log
            git commit -m "capture: lineups as of $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "nothing new captured this run"
          fi
