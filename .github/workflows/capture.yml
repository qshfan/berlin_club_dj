name: capture ephemeral lineups

# Sisyphos and Tresor publish lineups late and remove them after the party. This captures
# them before they vanish (gone by Wed/Thu), commits the updated database, then builds and
# deploys the site. Runs once on Sunday; trigger manually anytime via the Actions tab.
#
# Why this deploys directly instead of letting deploy.yml's push-trigger handle it: a commit
# pushed with the default GITHUB_TOKEN does NOT trigger other workflows (GitHub's anti-loop
# rule), so a separate push-triggered deploy would never fire for the capture commit. Doing
# capture → commit → build → deploy in one workflow avoids that entirely.

on:
  workflow_dispatch:
  schedule:
    # Midnight Sat→Sun CET = Sat 23:00 UTC. (GitHub cron is UTC and ignores DST, so in
    # summer/CEST this effectively fires at 01:00 local — still the Sat→Sun small hours.)
    - cron: '0 23 * * 6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Incremental capture of every source: Sisyphos + Tresor (ephemeral) plus the cheap
      # Berghain archive + recent/upcoming set-time refresh. Fast (~1 min); NOT --full.
      - name: Capture all sources
        run: npm run capture -- --no-build

      - name: Commit any newly captured data
        run: |
          git config user.name  "capture-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/; then
            git add data/berlin.db data/capture.log
            git commit -m "capture: lineups as of $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "nothing new captured this run"
          fi

      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: capture
    runs-on: ubuntu-latest
    # Share the Pages concurrency queue with deploy.yml so the two never publish at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
