name: build & deploy (GitHub Pages)

# Dormant on purpose: GitHub Pages needs a public repo (or a paid plan for private).
# This repo is private and hosts elsewhere (Netlify/Cloudflare build dist/ on push), so
# there is no schedule and no push trigger — nothing here runs automatically and nothing
# fails weekly. If you make the repo public, add `push:`/`schedule:` back and enable Pages
# in Settings; the weekly data refresh already lives in capture.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only refresh from upstream on the cron / manual run. Push builds use the
      # committed data/berlin.db so a docs typo doesn't trigger a full re-crawl.
      # Incremental: Berghain archive + set-time enrichment touch only what changed.
      - name: Refresh data
        if: github.event_name != 'push'
        run: npm run capture -- --full --no-build

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
