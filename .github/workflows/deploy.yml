name: build & deploy (GitHub Pages)

# Builds dist/ and publishes it to GitHub Pages. Runs on every push to master — including
# the Sunday capture commit, so fresh data auto-redeploys — and can be triggered manually.
# The weekly upstream refresh itself lives in capture.yml; push builds here just use the
# committed data/berlin.db.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only refresh from upstream on the cron / manual run. Push builds use the
      # committed data/berlin.db so a docs typo doesn't trigger a full re-crawl.
      # Incremental: Berghain archive + set-time enrichment touch only what changed.
      - name: Refresh data
        if: github.event_name != 'push'
        run: npm run capture -- --full --no-build

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
