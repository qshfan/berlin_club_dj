name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sunday 06:00 UTC — after Klubnacht, before anyone looks.
    - cron: '0 6 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only refresh from upstream on the cron / manual run. Push builds use the
      # committed data/berlin.db so a docs typo doesn't trigger a 2.5k-request crawl.
      - name: Refresh data
        if: github.event_name != 'push'
        run: npm run ingest

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
